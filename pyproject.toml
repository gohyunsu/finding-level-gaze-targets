[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finding-level-gaze-targets"
version = "1.0.0"
description = "Finding-level gaze target construction from complete chest-radiograph scanpaths"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "torch>=2.1",
]

[project.urls]
Repository = "https://github.com/gohyunsu/finding-level-gaze-targets"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finding-level-gaze-results = "finding_level_gaze_targets.reporting.registry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
